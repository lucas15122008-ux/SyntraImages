name: App desktop

# Gera os instaladores do app de desktop do Syntra (Windows e Mac).
# - Em todo PR/push que mexe em desktop/: compila e deixa os instaladores
#   para baixar na aba "Actions" (seção Artifacts da execução).
# - Ao criar uma tag desktop-v* (ex.: desktop-v0.1.0): também publica um
#   rascunho de Release no GitHub com os instaladores anexados.
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            bundles: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: mac
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: |
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: syntra-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Syntra para desktop ${{ github.ref_name }}
          files: ${{ matrix.bundles }}
