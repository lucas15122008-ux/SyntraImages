[package]
name = "syntra-desktop"
version = "0.1.0"
description = "Syntra para Windows e Mac"
edition = "2021"
publish = false

[[bin]]
name = "syntra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
